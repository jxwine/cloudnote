appId: com.cloudnote.app
productName: 云笔记
directories:
  buildResources: resources
  output: release
files:
  - out/**
  # 托盘图标，主进程用 __dirname/../../build 取，dev 和打包后路径一致
  - build/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 云笔记
extraResources:
  - from: ../server/src
    to: server/src
  - from: ../server/node_modules
    to: server/node_modules
  - from: ../server/package.json
    to: server/package.json
