# 云笔记 · Nginx 反向代理配置
#
# 宝塔用法：网站 → 你的站点 → 设置 → 配置文件，把下面 location 段落粘进 server {} 里。
# 或者用「反向代理」功能填 http://127.0.0.1:4471，但**必须**手动补上 WebSocket 那三行，
# 否则笔记能存能读，就是多端不实时——这是自建时最容易踩的坑。

# 下面几段都用 ^~ 前缀，不是普通的 location。
# 原因：宝塔默认配置里有一条处理静态图片的正则规则
#     location ~ .*\.(gif|jpg|jpeg|png|bmp)$ { expires 30d; }
# Nginx 里正则的优先级高于普通前缀匹配，会把 /uploads/xxx.png 抢走，
# 拿去网站根目录找文件，结果就是「图片全都显示不出来」。
# ^~ 的优先级高于正则：一旦前缀命中就不再看正则，交给下面的反代处理。

# 实时同步通道：没有这段，WebSocket 握手会被当成普通请求打回 400
location ^~ /ws {
    proxy_pass http://127.0.0.1:4471;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接别被默认的 60s 掐断；客户端每 30s 有心跳，这里给足余量
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 接口
location ^~ /api/ {
    proxy_pass http://127.0.0.1:4471;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 笔记里可以内嵌图片，正文体积会比一般接口大
    client_max_body_size 20m;
    proxy_read_timeout 120s;
}

# 后台上传客户端安装包。单独一段，因为体积和超时的量级跟普通接口完全不是一回事。
# 不用管它写在 /api/ 前面还是后面：Nginx 的前缀匹配取最长命中的那条，
# /api/admin/releases 比 /api/ 长，所以上传一定走这里。
location ^~ /api/admin/releases {
    proxy_pass http://127.0.0.1:4471;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 安装包 80MB 起步。默认的 1m 会直接 413。
    client_max_body_size 500m;
    # 关掉请求缓冲：默认 Nginx 会把整个包先落到自己的临时文件再转发，
    # 又慢又吃磁盘，而且上传进度条会一直卡在 100% 等后端。
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# 安装包下载。走反代最省事，服务端已经带了 content-length 和文件名。
#
# 想让 Nginx 直接出静态文件（80MB 不必穿过 Node），把上面这段留着，
# 再把下面这段的注释去掉、路径改成你的 releases 目录——注意 URL 里的
# 目录名是发布记录的 id，和磁盘结构一一对应：
#
#   location ^~ /downloads/ {
#       alias /www/wwwroot/cloudnote/server/data/releases/;
#       add_header Content-Disposition "attachment";
#   }
location ^~ /downloads/ {
    proxy_pass http://127.0.0.1:4471;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 大文件别缓冲在内存里，边收边吐给客户端
    proxy_buffering off;
    proxy_read_timeout 1800s;
}

# 上传的图片
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4471;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 文件名是内容不变的随机串，可以放心让浏览器长期缓存
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location = /health {
    proxy_pass http://127.0.0.1:4471;
    access_log off;
}
